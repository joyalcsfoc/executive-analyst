resources:
  jobs:
    validate_metric_views:
      name: validate_metric_views
      description: >
        Read-only SQL assertions against the five metrics_* views: dim-key
        uniqueness (rely.at_most_one_match), view/fact row-count parity (fan-out
        canary), certified KPI trap formulas (weighted ROAS, CPL, PPM,
        discount_percent, revenue vs bookings, OEE scale/threshold), and inventory
        snapshot grain. Mirrors src/ontology/benchmark_questions.md. Safe to run
        anytime, including prod. Kept separate from apply_metric_views: it needs no
        grant/DDL privileges, a failure here must not block tag/grant application,
        and it should run on every metric-view edit rather than only alongside the
        grant pipeline.

      parameters:
        - name: catalog
          default: ${var.gold_catalog}
        - name: agent_sp
          default: ${var.agent_service_principal}

      tasks:
        - task_key: assert_dim_uniqueness
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/tests/assert_dim_uniqueness.sql

        - task_key: assert_view_row_counts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/tests/assert_view_row_counts.sql

        - task_key: assert_kpi_formulas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/tests/assert_kpi_formulas.sql

        - task_key: assert_snapshot_grain
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/tests/assert_snapshot_grain.sql

        # Gate 3: the agent's identity holds SELECT and nothing more, and still
        # holds SELECT on all five views. Reads grant metadata rather than
        # attempting a write -- see the header of the file for why.
        - task_key: assert_agent_readonly
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/tests/assert_agent_readonly.sql

        # Generated from src/ontology/exec_analyst.ttl by src/ontology/generate.py.
        # Checks the DATA in ontology.kg_* against the TBox; src/ontology/test_generate.py
        # checks the model that produced it. Both are needed — neither implies the other.
        - task_key: assert_kg_integrity
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/tests/assert_kg_integrity.sql
