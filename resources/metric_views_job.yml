resources:
  jobs:
    apply_metric_views:
      name: apply_metric_views
      description: >
        Materializes the ontology.kg_nodes/kg_edges property graph and its traversal
        functions, applies glossary tags and SELECT grants on the five metrics_* views,
        then drops legacy mv_executive_* views.

        All ontology SQL (materialize_kg, kg_functions, tag_metric_views) is
        GENERATED from src/ontology/exec_analyst.ttl by src/ontology/generate.py —
        run `./deploy.sh regen-tags` after editing the TTL, before running this job.

        edge_sources.sql is the exception: hand-written, and it must run first because
        materialize_kg reads the key-resolved views it creates.

        grant_kg.sql is NOT in this job: issuing GRANT requires MANAGE on the schema,
        which the warehouse service principal typically does not have. Run it once
        manually in the SQL editor as a catalog owner / metastore admin:
          src/ontology/grant_kg.sql

        Metric-view CREATE OR REPLACE is not in this job (definitions live in
        src/metric_views/metrics_*.sql). Re-add those tasks only when the YAML
        KPI contract changes and the runner has MANAGE on the views.

      parameters:
        - name: catalog
          default: ${var.gold_catalog}
        - name: grant_group
          default: ${var.genie_space_permission_group}

      tasks:
        # Key-resolved edge sources. Hand-written, not generated: relations whose
        # authoritative source is keyed on business IDs get them resolved to surrogate
        # keys here, because ea:edgeFrom names one relation and cannot express a join.
        # Must precede materialize_kg, which reads these views.
        - task_key: edge_sources
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ontology/edge_sources.sql

        - task_key: materialize_kg
          depends_on:
            - task_key: edge_sources
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ontology/materialize_kg.sql

        # CREATE OR REPLACE TABLE AS SELECT over empty sources succeeds with 0 rows,
        # so the run must verify its own output. Fails loudly if the gold dims/facts
        # were mid-TRUNCATE (upstream reload) when materialize_kg read them.
        - task_key: assert_kg_integrity
          depends_on:
            - task_key: materialize_kg
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/tests/assert_kg_integrity.sql

        - task_key: kg_functions
          depends_on:
            - task_key: assert_kg_integrity
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ontology/kg_functions.sql

        - task_key: tag_metric_views
          depends_on:
            - task_key: kg_functions
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/metric_views/tag_metric_views.sql

        - task_key: drop_legacy_mv_executive
          depends_on:
            - task_key: tag_metric_views
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/metric_views/drop_legacy_mv_executive.sql
