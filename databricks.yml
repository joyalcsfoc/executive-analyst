bundle:
  name: executive-analyst
  engine: direct # genie_spaces require the direct deployment engine

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse ID that the Genie space and metric-view job use. Must have SELECT on gold facts and CREATE VIEW on domain schemas.
  gold_catalog:
    description: Unity Catalog where fact tables live and metric views are created (gold_dev for sandbox, gold for production).
    default: gold_dev
  genie_space_permission_level:
    description: Permission level granted to genie_space_permission_group (CAN_VIEW, CAN_RUN, CAN_EDIT, CAN_MANAGE).
    default: CAN_RUN
  genie_space_permission_group:
    description: >
      Workspace / account group for Genie space ACL and for GRANT SELECT on the five
      metrics_* views plus linked dim tables (apply_metric_views job param grant_group).
      Use 'account users' for all UC users, or a specific group name.
    default: account users

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-371e9acf-b9ec.cloud.databricks.com
    variables:
      warehouse_id: d2533a75c1bd9265
      gold_catalog: gold_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-371e9acf-b9ec.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: joyal.cs@focaloid.com
    variables:
      gold_catalog: gold
